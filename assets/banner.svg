<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 4; opacity: 0.5; }
      50% { r: 7; opacity: 1; }
    }

    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .glow-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .flow-line { stroke: url(#title-grad); stroke-width: 1.5; stroke-dasharray: 8 8; animation: lineFlow 12s linear infinite; opacity: 0.4; }
    .animated-node { animation: nodePulse 3s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Background Dynamic Mesh / Grid (Background Layer) -->
  <g class="bg-grid">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="220" x2="900" y2="220" />
    <line x1="0" y1="280" x2="900" y2="280" />
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="850" y1="0" x2="850" y2="320" />
  </g>

  <!-- Ambient Glowing Orbs (Midground Animation) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" class="glow-circle" filter="url(#glow)" />
  <circle cx="750" cy="240" r="160" fill="#818cf8" class="glow-circle" filter="url(#glow)" style="animation-delay: 3s;" />

  <!-- Dynamic Network Connection Lines (Midground) -->
  <path d="M 80,240 Q 250,100 450,220 T 820,100" fill="none" class="flow-line" />
  <path d="M 50,80 Q 300,280 600,120 T 850,260" fill="none" class="flow-line" style="animation-duration: 8s;" />

  <!-- Animated Floating Particle Nodes (Midground) -->
  <circle cx="180" cy="120" r="5" fill="#38bdf8" class="particle-1 animated-node" />
  <circle cx="720" cy="100" r="6" fill="#c084fc" class="particle-2 animated-node" />
  <circle cx="600" cy="230" r="4" fill="#818cf8" class="particle-3 animated-node" />
  <circle cx="300" cy="260" r="5" fill="#38bdf8" class="particle-2 animated-node" />

  <!-- Decorative Glassmorphism Backplate for Text Clarity -->
  <rect x="40" y="30" width="820" height="260" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- FOREGROUND LAYER - Header & Badges (Guaranteed Unhidden & Legible) -->
  <!-- Top Category Tag -->
  <g transform="translate(65, 55)">
    <rect width="210" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="105" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
      ⚡ VDI &amp; DAAS ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="65" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" filter="url(#shadow)">
    Awesome <tspan fill="url(#title-grad)">VDI &amp; DaaS</tspan>
  </text>

  <!-- Subtitle -->
  <text x="65" y="168" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Curated List of Virtual Desktop Infrastructure, Cloud PCs &amp; App Streaming
  </text>

  <!-- Foreground Feature Badges / Pills -->
  <g transform="translate(65, 205)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        💻 Cloud Desktops
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(177, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        🚀 Open-Source VDI
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(354, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        🌐 Remote Work &amp; BYOD
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(546, 0)">
      <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        🔒 Self-Hosted &amp; SaaS
      </text>
    </g>
  </g>
</svg>
